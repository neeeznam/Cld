[package]
name = "kanalcalc"
version = "0.1.0"
description = "KanalCalc — proračun pada pritiska u kanalima"
edition = "2021"

[lib]
name = "kanalcalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
